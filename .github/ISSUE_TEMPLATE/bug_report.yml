name: Ошибка / Bug report
description: Сообщить о проблеме Renga Server Switcher
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Не вставляйте реальные IP, DNS, имена пользователей, ключи, личные пути, settings.ini и дампы без обезличивания."
  - type: input
    id: version
    attributes:
      label: Версия модуля
      placeholder: "1.1.2"
    validations:
      required: true
  - type: input
    id: renga
    attributes:
      label: Версия Renga
      placeholder: "9.3.32980.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Используйте обезличенные тестовые значения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
